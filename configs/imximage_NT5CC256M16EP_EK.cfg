/*
 * i.MX6ULL U-Boot Image Configuration File (imximage.cfg)
 * Target Board: ATK-IMX6U (ALIENTEK / RightPoint Atom)
 * DDR Memory:   Nanya NT5CC256M16EP-EK (DDR3L-1866, 13-13-13)
 * Capacity:     4Gb (512MB) via 16-bit bus, single chip
 * DDR Clock:    396 MHz (DDR3-792 data rate)
 *
 * Based on: NXP MX6ULL 14x14 EVK reference (board/freescale/mx6ullevk/)
 *
 * Key Timing Parameters (derived from NT5CC256M16EP-EK datasheet):
 *   DDR3L-1866 @ 396 MHz (tCK = 2.525 ns):
 *     CL=6, tRCD=6, tRP=6, tRAS=14, tRC=19
 *     tRFC=103 (260 ns), tREFI=3090 (7.8 us)
 *     tWR=6 (15 ns), CWL=5
 *
 * DDR3L Voltage: 1.35V (backward compatible with 1.5V DDR3)
 * ZQ Resistor:   240 ohm ± 1%
 */

#define __ASSEMBLY__

IMAGE_VERSION 2

BOOT_FROM sd

/*
 * The 'DATA' macro writes a 32-bit value to the specified address
 * during the Boot ROM's DCD (Device Configuration Data) phase.
 * Syntax: DATA 4 <address> <value>
 *
 * IOMUXC_BASE_ADDR  = 0x020E0000
 * MMDC_P0_BASE_ADDR = 0x021B0000
 * CCM_BASE_ADDR     = 0x020C4000
 */


/* ====================================================================
 * 1. CCM Clock Enable
 * ==================================================================== */
/* Enable all CCGR clocks (CCGR0 ~ CCGR6) */
DATA 4 0x020C4068 0xFFFFFFFF
DATA 4 0x020C406C 0xFFFFFFFF
DATA 4 0x020C4070 0xFFFFFFFF
DATA 4 0x020C4074 0xFFFFFFFF
DATA 4 0x020C4078 0xFFFFFFFF
DATA 4 0x020C407C 0xFFFFFFFF
DATA 4 0x020C4080 0xFFFFFFFF


/* ====================================================================
 * 2. IOMUXC DDR Pad Configuration
 * ==================================================================== */
/* DRAM_SDCLK_ADDR: DDR_ODT, DDR_DRAM_SDCLK_Y */
DATA 4 0x020E04B4 0x000C0000
/* DRAM_SDQS0, DRAM_SDQS1: DSE=4 (40 Ohm) */
DATA 4 0x020E04AC 0x00000000

/* DDR_ADD_LINE: Address/Command group */
DATA 4 0x020E027C 0x00000030
DATA 4 0x020E0250 0x00000030
DATA 4 0x020E024C 0x00000030
DATA 4 0x020E0490 0x00000030
DATA 4 0x020E0288 0x000C0030

DATA 4 0x020E0270 0x00000000
DATA 4 0x020E0260 0x00000030
DATA 4 0x020E0264 0x00000030
DATA 4 0x020E04A0 0x00000030

/* DRAM_SDQS0: DSE=4, DDR_INPUT=1 */
DATA 4 0x020E0494 0x00020000
DATA 4 0x020E0280 0x00000030
DATA 4 0x020E0284 0x00000030

/* DRAM_SDQS1: DSE=4, DDR_INPUT=1 */
DATA 4 0x020E04B0 0x00020000
DATA 4 0x020E0498 0x00000030
DATA 4 0x020E04A4 0x00000030

/* DRAM_DQM0, DRAM_DQM1 */
DATA 4 0x020E0244 0x00000030
DATA 4 0x020E0248 0x00000030


/* ====================================================================
 * 3. MMDC PHY (DDR_PHY) Initialization
 * ==================================================================== */

/* MMDCx_MAP: Memory Map Configuration
 *   0xA1390003 — 4Gb density, 16-bit bus, single CS0, 16 rows, 10 cols */
DATA 4 0x021B0800 0xA1390003

/* MMDCx_MISC: Read/Write leveling delays */
DATA 4 0x021B080C 0x00000004

/* DQ Mapping: Byte lane to DQ swap configuration */
DATA 4 0x021B083C 0x41640158
DATA 4 0x021B0848 0x40403237
DATA 4 0x021B0850 0x40403C33

/* Write Leveling Delay Line: 0x33 per byte lane */
DATA 4 0x021B081C 0x33333333
DATA 4 0x021B0820 0x33333333

/* Read DQS Gating Delay Line: 0xF3 calibration default */
DATA 4 0x021B082C 0xF3333333
DATA 4 0x021B0830 0xF3333333

/* ZQ HW Calibration Control: 0x00944009 — ZQ_CS=1, ZQ_PW=1 */
DATA 4 0x021B08C0 0x00944009

/* ZQ Reset: tZQreset = 128 cycles */
DATA 4 0x021B08B8 0x00000800


/* ====================================================================
 * 4. MMDC Core Timing Registers
 * ==================================================================== */

/* MDSCR: Command = Precharge All */
DATA 4 0x021B001C 0x00008000

/* MDPDC (0x021B0004): Precharge Power Down — initial config
 *   [initial] 0x0002002D → [final] 0x0002552D (after MR commands) */
DATA 4 0x021B0004 0x0002002D

/* MDOTC (0x021B0008): DDR3 ODT Configuration
 *   0x1B333030 — ODT=60 ohm during writes */
DATA 4 0x021B0008 0x1B333030

/* MDCFG0 (0x021B000C): Refresh & Power-Down Timing
 *   [31:24] tRFC   = 103 (260ns / 2.525ns)
 *   [23:18] tXPDLL =  24 (DLL-on exit)
 *   [17:16] tXP    =   2 (fast exit)
 *   [15:0]  tXS/tXSDLL / timing
 *   0x676B52F3 */
DATA 4 0x021B000C 0x676B52F3

/* MDCFG1 (0x021B0010): Core Timing 1
 *   tRAS=14, tRC=19, tRCD=6, tRP=6, tWR=6, tWTR=4, tRTP=4
 *   0xB66D0B63 */
DATA 4 0x021B0010 0xB66D0B63

/* MDCFG2 (0x021B0014): Core Timing 2
 *   tFAW=14, tRRD=4, additional timing
 *   0x01FF00DB */
DATA 4 0x021B0014 0x01FF00DB

/* MDMISC (0x021B0018): Misc Configuration
 *   0x00201740 — 8 banks, 16-bit bus, normal mode */
DATA 4 0x021B0018 0x00201740

/* MDSCR: Command = NOP (clear command) */
DATA 4 0x021B001C 0x00008000

/* MDOR (0x021B002C): Operating Range
 *   0x000026D2 — Read/Write leveling delays */
DATA 4 0x021B002C 0x000026D2

/* MDOTC (0x021B0030): ODT Configuration continued
 *   0x006B1023 */
DATA 4 0x021B0030 0x006B1023

/* MDPDC (0x021B0040): Power Down Configuration
 *   0x0000004F — CS0 end address = 512MB (0x80000000 ~ 0x9FFFFFFF) */
DATA 4 0x021B0040 0x0000004F


/* ====================================================================
 * 5. MMDC Controller Enable
 * ==================================================================== */

/* MDCTL (0x021B0000): Memory Controller Control
 *   0x84180000 — SDE0=1, 16-bit bus, 15 rows, 10 cols, DDR3 */
DATA 4 0x021B0000 0x84180000

/* PHY ZQ Config: ZQ_PW=1, ZQ_CS=1 */
DATA 4 0x021B0890 0x00400000


/* ====================================================================
 * 6. Mode Register Set (MRS) Commands via MDSCR
 *
 * The lower nibble of the MDSCR value selects the target MR:
 *   ...2 = MR2, ...3 = MR3, ...1 = MR1, ...0 = MR0
 * Sequence follows JEDEC DDR3 standard: MR2 → MR3 → MR1 → MR0
 * ==================================================================== */

/* MR2: CWL=5 (for tCK >= 2.5ns), Dynamic ODT, Write Leveling disabled */
DATA 4 0x021B001C 0x02008032

/* MR3: Multi-Purpose Register (defaults) */
DATA 4 0x021B001C 0x00008033

/* MR1: DLL enabled, Output Driver RZQ/6 (40Ω), Rtt_Nom RZQ/4 (60Ω) */
DATA 4 0x021B001C 0x00048031

/* MR0: CL=6, BL=8, DLL Reset */
DATA 4 0x021B001C 0x15208030

/* ZQ Calibration: Start long calibration */
DATA 4 0x021B001C 0x04008040


/* ====================================================================
 * 7. Refresh Rate & Final Configuration
 * ==================================================================== */

/* MDREF (0x021B0020): Refresh Rate
 *   0x00000800 — tREFI = 3090 cycles @ 396 MHz (7.8 us)
 *   INT(7.8us / 2.525ns) = 3089 ≈ 3090 */
DATA 4 0x021B0020 0x00000800

/* Read DQS Gating Control: Calibration settings */
DATA 4 0x021B0818 0x00000227

/* MDPDC: Final — enable refresh */
DATA 4 0x021B0004 0x0002552D

/* MMDCx_DDR_TYPE: Set DDR3 mode */
DATA 4 0x021B0404 0x00011006

/* MDSCR: Clear — exit command state */
DATA 4 0x021B001C 0x00000000
